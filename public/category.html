<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shop — {store}</title>
  <meta name="description" content="Browse chairs, office desks, couches and office sets. Ask for prices on WhatsApp.">
  <meta name="theme-color" content="#f7f7fa">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>document.documentElement.classList.add("js")</script>
</head>
<body data-page="category">
  <a class="skip" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <section class="page-head">
      <canvas class="ribbon" data-ribbon="head" aria-hidden="true"></canvas>
      <div class="rail">
        <div class="page-head-copy">
          <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><a href="category.html">Shop</a><span aria-hidden="true">/</span><span id="crumb-current" aria-current="page"></span></nav>
          <h1 id="cat-title">Shop</h1>
          <p class="deck" id="cat-blurb"></p>
        </div>
      </div>
    </section>

    <section class="rail section-end" aria-labelledby="cat-title">
      <div class="toolbar">
        <nav class="tabs" id="chips" aria-label="Collections"></nav>
        <p class="count" id="result-count" aria-live="polite"></p>
      </div>
      <div class="grid" id="product-grid"></div>

      <div class="panel closing closing-panel">
        <div>
          <h2 class="closing-title">Can't find what you need?</h2>
          <p>We have more in the showroom than online. Tell us what you're looking for and we'll send photos and prices.</p>
        </div>
        <a class="btn btn-primary" id="cta-wa" href="#" target="_blank" rel="noopener"><span data-icon="chat"></span>Ask on WhatsApp</a>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/ribbon.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
